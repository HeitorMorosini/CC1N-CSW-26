<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Box com Gradiente</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e88e5, #26c6da);
      font-family: Arial, sans-serif;
    }

    .box {
      background: #fff;
      width: 350px;
      padding: 20px 25px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    
  </style>
</head>
<body>

  <div class="box">
    <h1>Gradiente Mão na massa</h1>

    <h2>Capítulo 2</h2>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit...
    </p>

    <h2>Capítulo 3</h2>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit...
    </p>
  </div>

</body>
</html>
